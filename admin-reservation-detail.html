<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>予約詳細</title>
<link rel="stylesheet" href="css/style.css">
<style>
.card{background:#fff;padding:20px;border-radius:10px;margin-bottom:20px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{border:1px solid #ddd;padding:10px}
th{background:#f5f5f5}
</style>
</head>

<body>

<header>
<div class="container header-inner">
<h1>予約詳細</h1>
</div>
</header>

<div class="container">

<a href="admin-reservations.html" class="back-btn">← 一覧へ戻る</a>

<div id="reservationInfo" class="card"></div>
<div id="orderHistory" class="card"></div>

</div>

<script src="js/config.js"></script>
<script src="js/admin-auth.js"></script>

<script>

const reservationNo =
new URLSearchParams(location.search).get("no");


const auth = {
headers:{
Authorization:
"Bearer " + localStorage.getItem("adminToken")
}
};


async function loadDetail(){

if(!reservationNo){
alert("予約番号がありません");
return;
}

try{

const [
  res1,
  res2
] = await Promise.all([

  fetch(
    API_URL+
    "/api/bbq/detail?reservationNo="+
    encodeURIComponent(reservationNo),
    auth
  ),

  fetch(
    API_URL+
    "/api/bbq/history?reservationNo="+
    encodeURIComponent(reservationNo),
    auth
  )

]);


const [
  data,
  history
] = await Promise.all([

  res1.json(),

  res2.json()

]);


document.getElementById("reservationInfo").innerHTML=`

<h2>${data.customerName||""}</h2>

<p>予約番号：${data.reservationNo||""}</p>
<p>利用日：${data.useDate||""}</p>
<p>人数：${data.people||0}名</p>
<p>プラン：${data.plan||""}</p>
<p>単価：¥${Number(data.price||0).toLocaleString()}</p>
<p>BBQ料金：¥${Number(data.total||0).toLocaleString()}</p>
<p>状態：${data.status||""}</p>
<p>会計：${data.paid||""}</p>

`;


let rows="";

(history.items||[]).forEach(item=>{

rows+=`

<tr>
<td>${item.itemName}</td>
<td>${item.qty}</td>
<td>¥${Number(item.unitPrice||0).toLocaleString()}</td>
<td>¥${Number(item.amount||0).toLocaleString()}</td>
</tr>

`;

});


const bbqTotal =
Number(data.total||0);

const optionTotal =
Number(history.total||0);

const grandTotal =
bbqTotal+optionTotal;


document.getElementById("orderHistory").innerHTML=`

<h2>追加注文履歴</h2>

<table>
<tr>
<th>商品</th>
<th>数量</th>
<th>単価</th>
<th>金額</th>
</tr>

${rows || `
<tr>
<td colspan="4">追加注文なし</td>
</tr>
`}

</table>

<p>BBQ：¥${bbqTotal.toLocaleString()}</p>
<p>追加注文：¥${optionTotal.toLocaleString()}</p>

<h2>
総合計：¥${grandTotal.toLocaleString()}
</h2>

`;

}catch(e){

console.error(e);
alert("読み込みエラー\n"+e.message);

}

}

loadDetail();

</script>

</body>
</html>
