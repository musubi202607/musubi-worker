<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
注文確認
</title>

<link
rel="stylesheet"
href="css/style.css">

<style>

.order-table{

  width:100%;

  border-collapse:collapse;

  margin-bottom:20px;

}

.order-table th,
.order-table td{

  border:1px solid #ddd;

  padding:10px;

  text-align:center;

}

.order-table th{

  background:#f5f5f5;

}

.total-area{

  text-align:right;

  font-size:20px;

  font-weight:bold;

  margin-bottom:20px;

}

.form-area{

  display:flex;

  flex-direction:column;

  gap:10px;

}

.form-area input,
.form-area textarea{

  width:100%;

  padding:10px;

  box-sizing:border-box;

}

</style>

</head>

<body>

<header>

<div class="container header-inner">

<h1>
注文確認
</h1>

</div>

</header>

<div class="container">

<a
href="cart.html"
class="back-btn">

← カートへ戻る

</a>

<a
href="index.html"
class="back-btn">

← トップページへ戻る

</a>

<br><br>

<div id="orderItems">

</div>

<div class="form-area">

<input
type="text"
id="customerName"
placeholder="お名前">

<input
type="tel"
id="customerTel"
placeholder="電話番号">

<label for="pickupTime">
受取希望時間
</label>

<input
type="time"
id="pickupTime">

<textarea
id="memo"
placeholder="備考（任意）"></textarea>

<button
class="order-btn"
onclick="sendOrder()">

注文を送信する

</button>

</div>

</div>

<script src="js/config.js"></script>
<script src="js/cart.js"></script>
<script src="js/order.js"></script>

</body>

</html>
