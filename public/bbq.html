<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>むすび BBQ予約</title>
  <meta
  name="description"
  content="むすびのBBQ予約ページです。ご希望の日程を選択してBBQプランをご予約いただけます。"
>
  <link
    rel="stylesheet"
    href="css/style.css"
  >
</head>

<body>

<header>
  <div class="container header-inner">

    <div>
      <h1>むすび BBQ予約</h1>
      <p>
      むすびでは、ご家族やグループで楽しめるBBQ予約を受け付けています。
      ご希望の日付を選択してご予約ください。
      </p>
    </div>

    <div>
      <a
        href="index.html"
        class="cart-button"
      >
        おにぎり
      </a>
    </div>

  </div>
</header>

<section class="products container">
  <div class="section-title">
    <h2>BBQセット</h2>
  </div>

  <div
    class="product-grid"
    id="bbqProducts"
  ></div>
</section>

<div class="container">
  <a
    href="staff.html"
    class="back-btn"
  >
    ← 店舗トップへ戻る
  </a>
</div>

<section
  class="container"
  id="calendarSection"
>
  <div class="section-title">
    <h2>予約可能日</h2>
  </div>

  <div id="calendar"></div>
  
  <div id="selectedDateInfo"></div>

  <button
    id="goOrder"
    class="order-btn"
    onclick="goOrder()"
    disabled
  >
    予約へ進む
  </button>
</section>

<script src="js/config.js"></script>
<script src="js/bbq.js"></script>

</body>
</html>
