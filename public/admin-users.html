<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>管理者管理</title>

<link rel="stylesheet" href="css/style.css">

<style>

table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
}

th,td{
  border:1px solid #ddd;
  padding:10px;
  text-align:center;
}

th{
  background:#f5f5f5;
}

.form-area{

  margin-top:30px;

  background:#fff;

  padding:20px;

  border-radius:10px;

  box-shadow:
    0 2px 6px rgba(0,0,0,.1);

}

.form-area input,
.form-area select{

  width:100%;

  padding:10px;

  margin-bottom:15px;

  box-sizing:border-box;

}

.check-label{

  display:flex;

  align-items:center;

  gap:10px;

  margin-bottom:20px;

}

.check-label input{

  width:auto;

  margin:0;

}

.save-btn{

  width:100%;

  padding:12px;

  background:#007bff;

  color:#fff;

  border:none;

  border-radius:8px;

  cursor:pointer;

}

.save-btn:hover{

  opacity:.9;

}

.cancel-btn{

  width:100%;

  padding:12px;

  margin-top:10px;

  background:#777;

  color:#fff;

  border:none;

  border-radius:8px;

  cursor:pointer;

}

.cancel-btn:hover{

  opacity:.9;

}

.header-right{

  margin-left:auto;

  text-align:right;

}

.header-right div{

  font-size:14px;

  margin-bottom:5px;

}

.logout-btn{

  display:inline-block;

  padding:8px 15px;

  background:#dc3545;

  color:#fff;

  text-decoration:none;

  border-radius:6px;

}

.logout-btn:hover{

  opacity:.9;

}

</style>

</head>

<body>

<header>

<div class="container header-inner">

<div>

<h1>管理者管理</h1>

<p>管理者アカウント</p>

</div>

<div class="header-right">

<div id="loginUser">
ログイン中
</div>

<a
href="#"
class="logout-btn"
onclick="logout();return false;"
>

ログアウト

</a>

</div>

</div>

</header>

<div class="container">

<a
href="admin.html"
class="back-btn"
>

← 管理画面へ戻る

</a>

<br><br>

<table>

<thead>

<tr>

<th>ID</th>

<th>表示名</th>

<th>権限</th>

<th>状態</th>

<th>操作</th>

</tr>

</thead>

<tbody id="userList">

</tbody>

</table>

<div class="form-area">

<h2 id="formTitle">

管理者追加

</h2>

<input
type="hidden"
id="editId"
>

<label>

ログインID

</label>

<input
id="id"
type="text"
>

<label>

表示名

</label>

<input
id="name"
type="text"
>

<label>

パスワード

</label>

<input
id="password"
type="password"
placeholder="編集時は空欄なら変更しません"
>

<label>

権限

</label>

<select id="role">

<option value="staff">

スタッフ

</option>

<option value="owner">

管理者

</option>

</select>

<label class="check-label">

<input
type="checkbox"
id="enabled"
checked
>

<span>

有効

</span>

</label>

<button

id="saveBtn"

class="save-btn"

onclick="saveUser()"

>

登録

</button>

<button

id="cancelBtn"

class="cancel-btn"

style="display:none"

onclick="cancelEdit()"

>

キャンセル

</button>

</div>

</div>

<script src="js/config.js"></script>

<script src="js/admin-auth.js"></script>

<script src="js/admin-users.js"></script>

</body>

</html>
