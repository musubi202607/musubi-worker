<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

BBQカレンダー管理

</title>

<link
rel="stylesheet"
href="css/style.css">

<style>

.calendar-header{

display:flex;

justify-content:center;

align-items:center;

gap:20px;

margin-bottom:20px;

}

.calendar-header button{

width:40px;

height:40px;

font-size:20px;

}

#monthTitle{

font-size:22px;

font-weight:bold;

}

.bbq-calendar{

display:grid;

grid-template-columns:repeat(7,1fr);

gap:8px;

}

.bbq-week{

text-align:center;

font-weight:bold;

padding:10px;

background:#f3f3f3;

border-radius:6px;

}

.bbq-cell{

min-height:120px;

border:1px solid #ddd;

border-radius:8px;

padding:8px;

cursor:pointer;

background:#fff;

transition:.2s;

}

.bbq-cell:hover{

background:#f8f8f8;

}

.bbq-empty{

background:none;

border:none;

cursor:default;

}

.bbq-date{

font-size:20px;

font-weight:bold;

margin-bottom:8px;

}

.bbq-open{

display:inline-block;

padding:2px 8px;

background:#2e7d32;

color:#fff;

border-radius:20px;

font-size:13px;

}

.bbq-close{

display:inline-block;

padding:2px 8px;

background:#c62828;

color:#fff;

border-radius:20px;

font-size:13px;

}

.bbq-limit{

margin-top:8px;

font-size:15px;

font-weight:bold;

}

.bbq-today{

border:2px solid #2196f3;

}

.modal{

display:none;

position:fixed;

left:0;

top:0;

width:100%;

height:100%;

background:rgba(0,0,0,.45);

justify-content:center;

align-items:center;

z-index:999;

}

.modal-content{

width:420px;

max-width:92%;

background:#fff;

padding:24px;

border-radius:10px;

}

.modal-content h2{

margin-top:0;

}

.modal-row{

margin-bottom:16px;

}

.modal-row label{

display:block;

margin-bottom:6px;

font-weight:bold;

}

.modal-content select,

.modal-content input{

width:100%;

padding:8px;

box-sizing:border-box;

}

.modal-buttons{

display:flex;

gap:10px;

margin-top:20px;

}

.modal-buttons button{

flex:1;

padding:10px;

}

.default-box{

background:#f5f5f5;

padding:12px;

border-radius:8px;

margin-bottom:20px;

}

.default-box h3{

margin-top:0;

margin-bottom:10px;

font-size:16px;

}

.lock-message{

background:#fff3cd;

border:1px solid #ffe69c;

padding:10px;

border-radius:6px;

margin-bottom:15px;

display:none;

}

</style>

</head>

<body>

<header>

<div class="container header-inner">

<h1>

BBQカレンダー管理

</h1>

</div>

</header>

<div class="container">

<a
href="admin.html"
class="back-btn">

← 管理画面へ戻る

</a>

<br><br>

<div class="calendar-header">

<button id="prevMonth">

◀

</button>

<div id="monthTitle"></div>

<button id="nextMonth">

▶

</button>

</div>

<div
id="calendarBody"
class="bbq-calendar">

</div>

</div>

<!-- モーダル -->
<div
id="editModal"
class="modal">

<div class="modal-content">

<h2>

BBQ設定

</h2>

<div
class="modal-row">

<label>

日付

</label>

<div
id="modalDate">

</div>

</div>

<div
class="default-box">

<h3>

通常設定

</h3>

<div
id="defaultInfo">

</div>

</div>

<div
id="holidayMessage"
class="lock-message">

この日は営業日管理で店休日になっています。<br>

BBQの設定は変更できません。

</div>

<div
id="editArea">

<div
class="modal-row">

<label>

状態

</label>

<select
id="modalStatus">

<option
value="○">

予約可

</option>

<option
value="×">

予約不可

</option>

</select>

</div>

<div
class="modal-row">

<label>

最大組数

</label>

<input
type="number"
id="modalLimit"
min="0">

</div>

</div>

<div
class="modal-buttons">

<button
id="saveModal">

保存

</button>

<button
id="deleteModal">

例外削除

</button>

<button
id="closeModal">

閉じる

</button>

</div>

</div>

</div>

<script
src="js/config.js"></script>

<script
src="js/bbq-calendar.js"></script>

<script
src="js/admin-auth.js"></script>

</body>

</html>
