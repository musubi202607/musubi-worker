<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0"
>

<title>
売上取消
</title>

<link
rel="stylesheet"
href="css/style.css"
>

<style>

.search-card{

background:#fff;
padding:20px;
border-radius:10px;
margin-bottom:20px;

}

.search-card label{

display:block;
margin-bottom:5px;
font-weight:bold;

}

.search-card input{

width:100%;
padding:10px;
margin-bottom:15px;
box-sizing:border-box;

}

.search-btn{

width:100%;
padding:14px;
font-size:18px;

}

.order-card{

background:#fff;
padding:15px;
margin-bottom:15px;
border-radius:10px;
box-shadow:0 2px 5px rgba(0,0,0,.1);
cursor:pointer;

}

.order-card:hover{

background:#f8f8f8;

}

.order-top{

display:flex;
justify-content:space-between;
align-items:center;

}

.order-type{

font-size:22px;

}

.order-no{

font-size:18px;
font-weight:bold;

}

.order-total{

font-size:20px;
font-weight:bold;
color:#e53935;

}

.order-paid{

margin-top:8px;
font-weight:bold;

}

.detail-card{

background:#fff;
padding:20px;
border-radius:10px;
margin-top:20px;
margin-bottom:90px;
display:none;

}

.detail-item{

display:flex;
justify-content:space-between;
margin:8px 0;

}

.action-area{

position:fixed;
left:0;
right:0;
bottom:0;
padding:15px;
background:#fff;
border-top:1px solid #ddd;
display:none;

}

.action-btn{

width:100%;
padding:16px;
font-size:20px;

}

.cancel-btn{

background:#d32f2f;
color:#fff;

}

</style>

</head>

<body>

<header>

<div class="container header-inner">

<h1>

売上取消

</h1>

</div>

</header>

<main class="container">

<a
href="#"
id="backBtn"
class="back-btn"
>

← 戻る

</a>

<div class="search-card">

<label>

開始日

</label>

<input
type="date"
id="startDate"
>

<label>

終了日

</label>

<input
type="date"
id="endDate"
>

<button
class="search-btn"
onclick="loadOrders()"
>

検索

</button>

</div>

<h2>

注文一覧

</h2>

<div id="orderList">

読み込み中...

</div>

<div
id="detailCard"
class="detail-card"
>

<h2>

注文詳細

</h2>

<div id="detailBody">

</div>

</div>

</main>

<div
id="actionArea"
class="action-area"
>

<button
id="actionBtn"
class="action-btn cancel-btn"
onclick="executeAction()"
>

取消

</button>

</div>

<script src="js/config.js"></script>
<script src="js/admin-auth.js"></script>
<script src="js/sales-cancel.js"></script>

<script>

const params =
new URLSearchParams(location.search);

const from =
params.get("from");

const backBtn =
document.getElementById("backBtn");

if(from==="kitchen"){

    backBtn.href =
    "kitchen-index.html";

}else{

    backBtn.href =
    "staff.html";

}

</script>

</body>

</html>
