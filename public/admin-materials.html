<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>

材料管理

</title>

<link
  rel="stylesheet"
  href="css/style.css"
>

<style>

/* =========================
   共通
========================= */

body{

  background:#f5f5f5;

}

.page{

  max-width:900px;

  margin:0 auto;

  padding:20px;

}

.page-header{

  margin-bottom:20px;

}

.page-header h1{

  margin:10px 0;

}

.page-header p{

  color:#666;

  margin:0;

}

.back-btn{

  display:inline-block;

  margin-bottom:15px;

}

/* =========================
   操作エリア
========================= */

.toolbar{

  display:flex;

  gap:10px;

  flex-wrap:wrap;

  align-items:center;

  margin-bottom:20px;

}

.search-box{

  flex:1;

  min-width:220px;

}

.search-box input{

  width:100%;

}

.add-btn{

  white-space:nowrap;

}

/* =========================
   一覧
========================= */

.material-list{

  display:flex;

  flex-direction:column;

  gap:12px;

}

.material-item{

  background:#fff;

  border-radius:10px;

  padding:15px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:15px;

  box-shadow:0 2px 5px rgba(0,0,0,.08);

}

.material-info{

  flex:1;

}

.material-name{

  font-size:18px;

  font-weight:bold;

  margin-bottom:6px;

}

.material-detail{

  color:#666;

  font-size:14px;

}

.material-actions{

  display:flex;

  gap:8px;

}

/* =========================
   モーダル
========================= */

.modal{

  display:none;

  position:fixed;

  inset:0;

  background:rgba(0,0,0,.45);

  z-index:999;

  overflow:auto;

}

.modal-content{

  background:#fff;

  max-width:700px;

  margin:30px auto;

  border-radius:12px;

  padding:20px;

}

.modal-content h2{

  margin-top:0;

}

.form-group{

  margin-bottom:16px;

}

.form-group label{

  display:block;

  font-weight:bold;

  margin-bottom:6px;

}

.form-group input,

.form-group select,

.form-group textarea{

  width:100%;

  box-sizing:border-box;

}

.form-row{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:15px;

}

.readonly-box{

  background:#f5f5f5;

  border:1px solid #ddd;

  border-radius:8px;

  padding:12px;

  font-size:18px;

  font-weight:bold;

}

.readonly-note{

  margin-top:5px;

  color:#888;

  font-size:12px;

  font-weight:normal;

}

.modal-buttons{

  display:flex;

  justify-content:flex-end;

  gap:10px;

  margin-top:20px;

}

/* =========================
   スマホ
========================= */

@media(max-width:700px){

  .material-item{

    flex-direction:column;

    align-items:flex-start;

  }

  .material-actions{

    width:100%;

  }

  .material-actions button{

    flex:1;

  }

  .form-row{

    grid-template-columns:1fr;

  }

}

</style>

</head>

<body>

<div class="page">

<a
  href="admin.html"
  class="back-btn"
>

← 管理画面へ戻る

</a>

<div class="page-header">

<h1>

材料管理

</h1>

<p>

材料の登録・編集を行います。

</p>

</div>

<div class="toolbar">

<div class="search-box">

<input

  type="text"

  id="searchText"

  placeholder="材料名で検索..."

  oninput="filterMaterials()"

>

</div>

<button

  class="add-btn"

  onclick="openAddModal()"

>

＋ 材料追加

</button>

</div>

<div

  id="materialList"

  class="material-list"

>

</div>

</div>

<!-- =========================
     モーダル
========================= -->

<div

  id="materialModal"

  class="modal"
>

<div class="modal-content">

<h2 id="modalTitle">

材料追加

</h2>

<form
  id="materialForm"
>

<input
  type="hidden"
  id="materialId"
>

<div class="form-group">

<label>

材料名

</label>

<input
  id="materialName"
  required
>

</div>

<div class="form-row">

<div class="form-group">

<label>

分類

</label>

<select id="materialCategory">

<option>米</option>
<option>具材</option>
<option>調味料</option>
<option>包材</option>
<option>飲料</option>
<option>その他</option>

</select>

</div>

<div class="form-group">

<label>

使用

</label>

<select id="materialUse">

<option value="○">○</option>
<option value="×">×</option>

</select>

</div>

</div>

<div class="form-row">

<div class="form-group">

<label>

使用単位

</label>

<select id="useUnit">

<option>g</option>
<option>kg</option>
<option>ml</option>
<option>L</option>
<option>個</option>
<option>枚</option>
<option>本</option>
<option>袋</option>
<option>箱</option>

</select>

</div>

<div class="form-group">

<label>仕入単位</label>

<select
  id="purchaseUnit"
  onchange="calculateUnitCost()"
>
  <option value="袋">袋</option>
  <option value="箱">箱</option>
  <option value="本">本</option>
  <option value="個">個</option>
  <option value="枚">枚</option>
</select>


<label>仕入数量</label>

<input
  type="number"
  id="purchaseQty"
  step="0.001"
  oninput="calculateUnitCost()"
>


<label>仕入数量単位</label>

<select
  id="purchaseQtyUnit"
  onchange="calculateUnitCost()"
>
  <option value="g">g</option>
  <option value="kg">kg</option>
  <option value="ml">ml</option>
  <option value="L">L</option>
  <option value="個">個</option>
  <option value="枚">枚</option>
  <option value="本">本</option>
</select>
  
</div>

</div>

<div class="form-row">

<div class="form-group">

<label>

仕入数量

</label>

<input

  type="number"

  id="purchaseQty"

  step="0.001"

  oninput="calculateUnitCost()"

>

</div>

<div class="form-group">

<label>

仕入価格（円）

</label>

<input

  type="number"

  id="purchasePrice"

  step="0.01"

  oninput="calculateUnitCost()"

>

</div>

</div>

<div class="form-group">

<label>

原価単価

</label>

<div class="readonly-box">

<div id="unitCost">

0.000 円/g

</div>

<div class="readonly-note">

（自動計算）

</div>

</div>

</div>

<div class="form-row">

<div class="form-group">

<label>

現在在庫

</label>

<input
  type="number"
  id="stock"
  step="0.001"
>

</div>

<div class="form-group">

<label>

発注点

</label>

<input
  type="number"
  id="reorderPoint"
  step="0.001"
>

</div>

</div>

<div class="form-row">

<div class="form-group">

<label>

発注点単位

</label>

<select id="reorderUnit">

<option>g</option>
<option>kg</option>
<option>ml</option>
<option>L</option>
<option>個</option>
<option>枚</option>
<option>本</option>
<option>袋</option>
<option>箱</option>

</select>

</div>

<div class="form-group">

<label>

仕入先

</label>

<input
  id="supplier"
>

</div>

</div>

<div class="form-group">

<label>

備考

</label>

<textarea

  id="remarks"

  rows="3"

></textarea>

</div>

<div class="modal-buttons">

<button

  type="button"

  onclick="closeModal()"

>

キャンセル

</button>

<button

  type="submit"

>

保存

</button>

</div>

</form>

</div>

</div>

<script src="js/config.js"></script>
<script src="js/admin-auth.js"></script>
<script src="js/admin-materials.js"></script>

</body>

</html>
