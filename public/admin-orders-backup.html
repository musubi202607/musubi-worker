<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>
注文履歴
</title>

<link
rel="stylesheet"
href="css/style.css"
>

<style>

.filter-card{

  background:#fff;

  padding:20px;

  border-radius:10px;

  margin-bottom:20px;

  box-shadow:
    0 2px 6px
    rgba(0,0,0,.1);

}

table{

  width:100%;

  border-collapse:collapse;

  background:#fff;

}

th,
td{

  border:1px solid #ddd;

  padding:10px;

}

th{

  background:#f5f5f5;

}

</style>

</head>

<body>

<header>

  <div class="container header-inner">

    <div>

      <h1>
        注文履歴
      </h1>

    </div>

  </div>

</header>

<div class="container">

  <a
    href="admin.html"
    class="back-btn"
  >
    ← 管理画面へ戻る
  </a>

  <div class="filter-card">

    <input
      type="date"
      id="startDate"
    >

    <input
      type="date"
      id="endDate"
    >

    <button onclick="loadOrders()">
      検索
    </button>

  </div>

  <table>

    <thead>

      <tr>

        <th>日時</th>

        <th>区分</th>

        <th>氏名</th>

        <th>商品</th>

        <th>数量</th>

        <th>金額</th>

      </tr>

    </thead>

    <tbody id="orderBody">

    </tbody>

  </table>

</div>

<script src="js/config.js"></script>

<script>

async function loadOrders(){

  const startDate =
    document.getElementById(
      'startDate'
    ).value;

  const endDate =
    document.getElementById(
      'endDate'
    ).value;

  const response =
    await fetch(

      API_URL +
      '?mode=orders' +
      '&start=' +
      encodeURIComponent(startDate) +
      '&end=' +
      encodeURIComponent(endDate)

    );

  const data =
    await response.json();

  let html = '';

  data.forEach(row => {

    html += `

      <tr>

        <td>
          ${row.date}
        </td>

        <td>
          ${row.type}
        </td>

        <td>
          ${row.name}
        </td>

        <td>
          ${row.item}
        </td>

        <td>
          ${row.qty}
        </td>

        <td>

          ¥${Number(
            row.amount || 0
          ).toLocaleString()}

        </td>

      </tr>

    `;

  });

  document.getElementById(
    'orderBody'
  ).innerHTML = html;

}

loadOrders();

</script>

</body>

</html>
