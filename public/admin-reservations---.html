<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>本日の予約一覧</title>

<link rel="stylesheet" href="css/style.css">

<style>

table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
}

th, td{
  border:1px solid #ddd;
  padding:10px;
  text-align:center;
}

th{
  background:#f5f5f5;
}

.status-ok{
  color:green;
  font-weight:bold;
}

.status-ng{
  color:red;
  font-weight:bold;
}

</style>
</head>

<body>

<header>
  <div class="container header-inner">
    <h1>本日の予約一覧</h1>
  </div>
</header>

<div class="container">

<a href="admin.html" class="back-btn">
  ← 管理画面へ戻る
</a>

<br><br>

<table>

<thead>
  <tr>
    <th>予約番号</th>
    <th>氏名</th>
    <th>人数</th>
    <th>プラン</th>
    <th>来店</th>
    <th>会計</th>
  </tr>
</thead>

<tbody id="reservationBody"></tbody>

</table>

</div>

<script src="js/config.js"></script>

<script>

async function loadReservations() {

  try {

    const response = await fetch(API_URL + '/api/reservations');

    const data = await response.json();

    const tbody = document.getElementById('reservationBody');

    tbody.innerHTML = '';

    data.forEach(item => {

      tbody.innerHTML += `
        <tr>

          <td>${item.reservationNo}</td>

          <td>
            <a href="admin-reservation-detail.html?no=${item.reservationNo}">
              ${item.customerName}
            </a>
          </td>

          <td>${item.people}</td>

          <td>${item.plan}</td>

          <td class="${item.status === '来店済' ? 'status-ok' : 'status-ng'}">
            ${item.status}
          </td>

          <td class="${item.paid === '済' ? 'status-ok' : 'status-ng'}">
            ${item.paid || '未'}
          </td>

        </tr>
      `;

    });

  } catch (error) {
    console.error(error);
    alert('予約取得エラー');
  }

}

loadReservations();

</script>

</body>
</html>
