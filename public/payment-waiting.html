<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
会計
</title>

<link
  rel="stylesheet"
  href="css/style.css"
>

<style>

.payment-card{

  background:#fff;

  border-radius:10px;

  padding:20px;

  margin-bottom:20px;

  box-shadow:
    0 2px 6px rgba(0,0,0,.1);

}

.payment-type{

  display:inline-block;

  padding:4px 10px;

  border-radius:20px;

  color:#fff;

  font-size:12px;

  margin-bottom:10px;

}

.payment-type.onigiri{

  background:#43a047;

}

.payment-type.bbq{

  background:#ff7043;

}

.price-row{

  display:flex;

  justify-content:space-between;

  margin:4px 0;

}

.total{

  font-size:24px;

  font-weight:bold;

  margin-top:12px;

}

.pay-btn{

  width:100%;

  margin-top:15px;

  padding:12px;

  border:none;

  border-radius:8px;

  background:#4caf50;

  color:#fff;

  cursor:pointer;

}

.pay-btn:hover{

  opacity:.9;

}

</style>

</head>


<body>


<header>

<div class="container header-inner">

<h1>
会計
</h1>

</div>

</header>



<div class="container">


<a
href="staff.html"
class="back-btn"
>

← 店舗メニューへ戻る

</a>



<h2 style="margin:20px 0;">

会計待ち一覧

</h2>



<div id="paymentList">

読み込み中...

</div>



</div>



<script src="js/config.js"></script>

<script src="js/admin-auth.js"></script>



<script>


// =========================
// 認証ヘッダー
// =========================

function authHeader(){

  return {

    Authorization:

      "Bearer " +

      localStorage.getItem(
        "adminToken"
      )

  };

}



// =========================
// 会計待ち一覧
// =========================

async function loadPayments(){


try{


const response =

await fetch(

API_URL +

"/api/payments/waiting",

{

headers:

authHeader()

}

);



const data =

await response.json();



if(!response.ok){


console.error(
data
);


document.getElementById(
"paymentList"
).innerHTML =

`

<div class="payment-card">

${data.message || "取得失敗"}

</div>

`;


return;


}



if(!Array.isArray(data)){


console.error(

"会計待ちデータ形式エラー",

data

);



document.getElementById(
"paymentList"
).innerHTML =

`

<div class="payment-card">

データ取得エラー

</div>

`;


return;


}



let html = "";



if(data.length===0){


html =

`

<div class="payment-card">

会計待ちはありません

</div>

`;



}else{


data.sort((a,b)=>{


if(a.type===b.type){

return 0;

}


return a.type==="onigiri"

? -1

: 1;


});





data.forEach(item=>{


const typeClass =

item.type==="onigiri"

? "onigiri"

: "bbq";



const typeName =

item.type==="onigiri"

? "🍙 おにぎり"

: "🔥 BBQ";



const noLabel =

item.type==="onigiri"

? "注文番号"

: "予約番号";



let detailHtml = "";



if(item.type==="onigiri"){


(item.items || [])

.forEach(product=>{


detailHtml +=

`

<div class="price-row">

<span>

${product.name}

×

${product.qty}

</span>

</div>


<div class="price-row">

<span>
@${Number(
product.price || 0
).toLocaleString()}
円
</span>

<span>
¥${Number(
product.amount || 0
).toLocaleString()}
</span>

</div>

`;

});


}else{


detailHtml =


`

<div class="price-row">

<span>
BBQ料金
</span>

<span>

¥${Number(
item.bbqPrice || 0
).toLocaleString()}

</span>

</div>


<div class="price-row">

<span>
追加注文
</span>

<span>

¥${Number(
item.optionTotal || 0
).toLocaleString()}

</span>

</div>

`;

}





html +=


`

<div class="payment-card">


<div class="payment-type ${typeClass}">

${typeName}

</div>



<h2>

${item.customerName || ""}

</h2>



<p>

${noLabel}：

${item.no || ""}

</p>



${item.type==="bbq"

?

`

<p>
プラン：
${item.plan || ""}
</p>


<p>
単価：

¥${Number(
item.unitPrice || 0
).toLocaleString()}

</p>


<p>
人数：

${item.people || 0}名

</p>


<h3>
追加注文
</h3>


${

(item.optionItems || [])

.map(o=>`

<p>

${o.name}

${o.qty}個

<br>

¥${Number(
o.amount || 0
).toLocaleString()}

</p>

`)

.join("")

}


`

:""

}



${

item.type==="onigiri"

?

detailHtml

:

""

}



<hr>



<div class="total">

合計：

¥${Number(
item.total || 0
).toLocaleString()}

</div>



<button

class="pay-btn"

onclick="paidUpdate(

'${item.type}',

'${item.no}'

)"

>

会計済みにする

</button>



</div>

`;

});


}



document.getElementById(

"paymentList"

).innerHTML = html;



}

catch(error){


console.error(

"会計取得エラー",

error

);



document.getElementById(

"paymentList"

).innerHTML =


`

<div class="payment-card">

通信エラー

</div>

`;

}


}




// =========================
// 会計済更新
// =========================

async function paidUpdate(type,no){


if(

!confirm(

"会計済みにしますか？"

)

){

return;

}



let url="";

let body={};



if(type==="onigiri"){


url =

API_URL +

"/api/onigiri/paid";


body = {

orderNo:no

};



}else{


url =

API_URL +

"/api/bbq/paid";


body = {

reservationNo:no

};


}



const response =

await fetch(

url,

{

method:"POST",

headers:{

"Content-Type":

"application/json",


Authorization:

"Bearer " +

localStorage.getItem(
"adminToken"
)

},


body:

JSON.stringify(body)

}

);



const result =

await response.json();



if(result.success){


alert(

"会計済みにしました"

);


loadPayments();



}else{


alert(

result.message ||

"更新失敗"

);


}



}




// =========================
// 初期表示
// =========================

loadPayments();


</script>


</body>

</html>
