<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>店舗注文受付</title>

<link
  rel="stylesheet"
  href="css/style.css"
>

<meta
  name="mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="default"
>

<meta
  name="apple-mobile-web-app-title"
  content="店舗注文"
>

<link
  rel="apple-touch-icon"
  href="icon.png"
>

<style>

/* =========================
   レイアウト
========================= */

main{

  padding-bottom:110px;

}

.staff-order-header{

  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:20px;

}


/* =========================
   商品一覧
========================= */

.staff-order-list{

  display:flex;

  flex-direction:column;

  gap:12px;

}


.category-title{

  margin-top:25px;

  padding-bottom:8px;

  border-bottom:2px solid #ddd;

  font-size:22px;

  font-weight:bold;

}


.staff-product{

  background:#fff;

  border-radius:12px;

  padding:15px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  box-shadow:
  0 2px 5px rgba(0,0,0,.1);

}


.staff-product-name{

  flex:1;

  font-size:18px;

  font-weight:bold;

}


.staff-product-price{

  width:80px;

  text-align:right;

}


/* =========================
   数量
========================= */

.qty-area{

  display:flex;

  align-items:center;

  gap:10px;

}


.qty-btn{

  width:42px;

  height:42px;

  border:none;

  border-radius:8px;

  font-size:22px;

  cursor:pointer;

}


.qty-number{

  width:32px;

  text-align:center;

  font-size:18px;

  font-weight:bold;

}


/* =========================
   入力フォーム
========================= */

.order-form{

  background:#fff;

  border-radius:12px;

  padding:20px;

  margin-top:20px;

}


.order-form h2{

  margin-top:0;

}


.order-form label{

  display:block;

  margin-bottom:5px;

  font-weight:bold;

}


.order-form input,
.order-form textarea{

  width:100%;

  box-sizing:border-box;

  padding:10px;

  margin-bottom:15px;

}


/* =========================
   完了モーダル
========================= */

.complete-modal{

  position:fixed;

  inset:0;

  background:rgba(0,0,0,.45);

  display:flex;

  justify-content:center;

  align-items:center;

  z-index:3000;

}


.complete-box{

  width:90%;

  max-width:350px;

  background:#fff;

  border-radius:15px;

  padding:30px;

  text-align:center;

}


.complete-icon{

  font-size:60px;

}


/* =========================
   固定バー
========================= */

.bottom-order-bar{

  position:fixed;

  left:0;

  right:0;

  bottom:0;

  background:#fff;

  border-top:2px solid #ddd;

  box-shadow:0 -2px 8px rgba(0,0,0,.15);

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:15px;

  padding:12px;

  z-index:2000;

}


.bottom-info{

  display:flex;

  flex-direction:column;

}


.bottom-count{

  font-size:15px;

  color:#666;

}


.bottom-total{

  font-size:24px;

  font-weight:bold;

}


.bottom-order-button{

  width:180px;

  height:52px;

  border:none;

  border-radius:10px;

  background:#28a745;

  color:#fff;

  font-size:18px;

  cursor:pointer;

}

/* =========================
   未会計チェック
========================= */

.unpaid-check{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:15px;
  font-size:18px;
  font-weight:bold;
}

.unpaid-check input{
  width:26px;
  height:26px;
  margin:0;
  cursor:pointer;
}
  
</style>

</head>

<body>

<header>

  <div class="container header-inner">

    <h1>

      店舗注文受付

    </h1>

  </div>

</header>

<main class="container">

<div class="staff-order-header">

<a
  href="staff.html"
  class="back-btn"
>

← 店舗トップへ戻る

</a>

</div>

<div
  id="productList"
  class="staff-order-list"
>

読み込み中...

</div>

<!-- =========================
     注文情報
========================= -->

<div class="order-form">

  <h2>
    注文情報
  </h2>

  <label>
    氏名（車番）
  </label>

  <input
    id="customerName"
    placeholder="お名前"
  >

  <br><br>

  <label>
    備考
  </label>

  <textarea
    id="note"
    rows="3"
    placeholder="備考"
  ></textarea>

  <label class="unpaid-check">
  <input
    type="checkbox"
    id="unpaidCheck"
  >
  未会計で登録する
  </label>

</div>

<!-- =========================
     注文完了モーダル
========================= -->

<div
  id="completeModal"
  class="complete-modal"
  style="display:none;"
>

  <div class="complete-box">

    <div class="complete-icon">

      ✅

    </div>

    <h2>

      注文を登録しました

    </h2>

    <p>

      注文番号

      <br><br>

      <strong
        id="completeOrderNo"
      ></strong>

    </p>

    <button
      class="bottom-order-button"
      onclick="resetOrder()"
      style="width:100%;margin-top:20px;"
    >

      新しい注文を受付

    </button>

  </div>

</div>


<!-- =========================
     画面下固定バー
========================= -->

<div class="bottom-order-bar">

  <div class="bottom-info">

    <div
      id="totalCount"
      class="bottom-count"
    >

      0点

    </div>

    <div class="bottom-total">

      <span id="totalPrice">

        0

      </span>

      円

    </div>

  </div>

  <button
    class="bottom-order-button"
    onclick="submitStaffOrder()"
  >

    注文登録

  </button>

</div>

</main>


<script src="js/config.js"></script>

<script src="js/staff-order.js"></script>

</body>

</html>
