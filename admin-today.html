<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>本日の予約一覧</title>

<link rel="stylesheet" href="css/style.css">

<style>

table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
}

th, td{
  border:1px solid #ddd;
  padding:10px;
  text-align:center;
}

th{
  background:#f5f5f5;
}

.status-ok{
  color:#28a745;
  font-weight:bold;
}

.status-ng{
  color:#dc3545;
  font-weight:bold;
}

</style>

</head>

<body>

<header>
  <div class="container header-inner">
    <h1>本日の予約一覧</h1>
  </div>
</header>

<div class="container">

<a href="admin.html" class="back-btn">
  ← 管理画面へ戻る
</a>

<br><br>

<table>

<thead>
  <tr>
    <th>予約番号</th>
    <th>氏名</th>
    <th>人数</th>
    <th>利用日</th>
    <th>来店状況</th>
    <th>会計</th>
  </tr>
</thead>

<tbody id="reservationBody"></tbody>

</table>

</div>

<script src="js/config.js"></script>
<script src="js/admin-auth.js"></script>

<script>

// =========================
// 本日の予約取得（Worker版）
// =========================
async function loadReservations() {

  const res = await fetch(API_URL + '/api/reservations/today');
  const data = await res.json();

  let html = '';

  data.forEach(r => {

    html += `
      <tr>

        <td>${r.reservationNo}</td>

        <td>${r.customerName}</td>

        <td>${r.people}</td>

        <td>${r.useDate}</td>

        <td>
          ${
            r.status === '来店済'
            ? '<span class="status-ok">来店済</span>'
            : '<span class="status-ng">未受付</span>'
          }
        </td>

        <td>
          ${
            r.paid === '済'
            ? '<span class="status-ok">済</span>'
            : '<span class="status-ng">未</span>'
          }
        </td>

      </tr>
    `;

  });

  document.getElementById('reservationBody').innerHTML = html;

}

loadReservations();

</script>

</body>
</html>
